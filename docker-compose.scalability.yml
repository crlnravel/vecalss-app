name: vecalss-scalability

x-api-common: &api-common
  build:
    context: .
    dockerfile: Dockerfile.scalability
    args:
      DATABASE_URL: postgresql://vecalss:vecalss@postgres.invalid:5432/vecalss
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${SCALABILITY_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  environment:
    APP_BASE_URL: http://api1:3000
    DATABASE_URL: postgresql://vecalss:vecalss@postgres.invalid:5432/vecalss
    NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${SCALABILITY_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    REDIS_URL: redis://redis:6379/0
    SCALABILITY_RATE_LIMIT_NAMESPACE: ${SCALABILITY_RATE_LIMIT_NAMESPACE:-vecalss:rate-limit:scalability}
    SCALABILITY_RATE_LIMIT_WINDOW_MS: ${SCALABILITY_RATE_LIMIT_WINDOW_MS:-60000}
    SCALABILITY_SIMULATION: "1"
    SCALABILITY_SIMULATION_SECRET: ${SCALABILITY_SIMULATION_SECRET:?SCALABILITY_SIMULATION_SECRET is required}
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30

  api1:
    <<: *api-common
    environment:
      APP_BASE_URL: http://api1:3000
      DATABASE_URL: postgresql://vecalss:vecalss@postgres.invalid:5432/vecalss
      INSTANCE_ID: api-1
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${SCALABILITY_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      REDIS_URL: redis://redis:6379/0
      SCALABILITY_RATE_LIMIT_NAMESPACE: ${SCALABILITY_RATE_LIMIT_NAMESPACE:-vecalss:rate-limit:scalability}
      SCALABILITY_RATE_LIMIT_WINDOW_MS: ${SCALABILITY_RATE_LIMIT_WINDOW_MS:-60000}
      SCALABILITY_SIMULATION: "1"
      SCALABILITY_SIMULATION_SECRET: ${SCALABILITY_SIMULATION_SECRET:?SCALABILITY_SIMULATION_SECRET is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  api2:
    <<: *api-common
    environment:
      APP_BASE_URL: http://api2:3000
      DATABASE_URL: postgresql://vecalss:vecalss@postgres.invalid:5432/vecalss
      INSTANCE_ID: api-2
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${SCALABILITY_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      REDIS_URL: redis://redis:6379/0
      SCALABILITY_RATE_LIMIT_NAMESPACE: ${SCALABILITY_RATE_LIMIT_NAMESPACE:-vecalss:rate-limit:scalability}
      SCALABILITY_RATE_LIMIT_WINDOW_MS: ${SCALABILITY_RATE_LIMIT_WINDOW_MS:-60000}
      SCALABILITY_SIMULATION: "1"
      SCALABILITY_SIMULATION_SECRET: ${SCALABILITY_SIMULATION_SECRET:?SCALABILITY_SIMULATION_SECRET is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  loadtest:
    image: node:22-alpine
    working_dir: /workspace
    command: ["node", "scripts/simulate-two-api-redis.mjs"]
    environment:
      SCALABILITY_API_URLS: http://api1:3000,http://api2:3000
      SCALABILITY_SIMULATION_SECRET: ${SCALABILITY_SIMULATION_SECRET:?SCALABILITY_SIMULATION_SECRET is required}
    volumes:
      - ./scripts:/workspace/scripts:ro
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
